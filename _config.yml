title: Graysen Brinkman
email: [graybrinkman06@gmail.com](mailto:graybrinkman06@gmail.com)

description: >
Portfolio of Graysen Brinkman, Aerospace Engineering student at Embry-Riddle Aeronautical University pursuing a minor in Applied Mathematics.

minimal_mistakes_skin: default
search: false

remote_theme: mmistakes/minimal-mistakes

markdown: kramdown

permalink: /:categories/:title/

paginate: 5
paginate_path: /page:num/

include:

* _pages

plugins:

* jekyll-paginate
* jekyll-sitemap
* jekyll-gist
* jemoji
* jekyll-include-cache

defaults:

* scope:
  path: ""
  type: posts
  values:
  layout: single
  author_profile: false
  read_time: true
  comments: true
  share: true
  related: true

* scope:
  path: "_pages"
  type: pages
  values:
  layout: single
  author_profile: false

category_archive:
type: liquid
path: /categories/

tag_archive:
type: liquid
path: /tags/

atom_feed:
hide: true
