title: Graysen Brinkman
email: [graysenbrinkman@gmail.com](mailto:graysenbrinkman@gmail.com)

description: >
Portfolio of Graysen Brinkman, Aerospace Engineering student at
Embry-Riddle Aeronautical University pursuing a minor in Applied Mathematics.

minimal_mistakes_skin: "default"
search: false

# Build settings

markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

permalink: /:categories/:title/

paginate: 5
paginate_path: /page:num/

include:

* _pages

plugins:

* jekyll-paginate
* jekyll-sitemap
* jekyll-gist
* jemoji
* jekyll-include-cache

defaults:

# Posts

* scope:
  path: ""
  type: posts
  values:
  layout: single
  author_profile: false
  read_time: true
  comments: true
  share: true
  related: true

# Pages

* scope:
  path: "_pages"
  type: pages
  values:
  layout: single
  author_profile: false

category_archive:
type: liquid
path: /categories/

tag_archive:
type: liquid
path: /tags/

atom_feed:
hide: true
